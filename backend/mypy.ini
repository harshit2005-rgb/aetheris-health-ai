; Mypy configuration.
;
; docs/09-PROJECT_STRUCTURE.md places type-checker config in backend/mypy.ini
; rather than in pyproject.toml. Settings below are carried over verbatim from
; the former [tool.mypy] sections.

[mypy]
python_version = 3.13
strict = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
disallow_any_unimported = False
disallow_any_expr = False
disallow_any_decorated = False
disallow_any_explicit = False

[mypy-asyncpg.*]
ignore_missing_imports = True

[mypy-pydantic_extra_types.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-passlib.*]
ignore_missing_imports = True
