[alembic]
# Path to the directory containing the Alembic environment scripts
# (docs/09-PROJECT_STRUCTURE.md names this directory `migrations/`)
script_location = migrations

# Template used when generating new migrations
file_template = %%(rev)s_%%(slug)s

# sys.path prepend — allows Alembic to import from the app package
prepend_sys_path = .

# Database URL — uses the same async URL as the application
sqlalchemy.url = postgresql+asyncpg://aetheris:aetheris@localhost:5432/aetheris

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
