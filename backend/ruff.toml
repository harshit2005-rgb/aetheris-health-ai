# Ruff configuration.
#
# docs/09-PROJECT_STRUCTURE.md places linter config in backend/ruff.toml rather
# than in pyproject.toml. Settings are carried over from the former
# [tool.ruff] sections in pyproject.toml.

target-version = "py313"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TC",  # flake8-type-checking (was selected as "TCH", renamed in ruff 0.9)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument (FastAPI Depends uses this)
]

[lint.per-file-ignores]
# FastAPI resolves endpoint and dependency signatures at runtime, against the
# module's real globals. Moving those annotations into a TYPE_CHECKING block —
# which is exactly what the TC rules autofix does — raises NameError when the
# route is registered. Keep the imports at runtime here.
"app/api/**/*.py" = ["TC"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
